<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CBT Sekolah</title>
<link rel="manifest" id="pwaManifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="theme-color" content="#1e40af">
<style>
:root{
  --teal:#00C2CB; --magenta:#FF00FF; --yellow:#FFC700; --black:#000000; --white:#FFFFFF; --beige:#F5F3DC;
  --bg:var(--beige); --card:var(--white); --text:#000000; --muted:#555048; --border:#000000;
  --danger:#FF3B3B; --success:#00B86B; --warn:var(--yellow);
  --radius:0px; --radius-sm:4px;
  --shadow-1:4px 4px 0 var(--black); --shadow-2:8px 8px 0 var(--black);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html,body{height:100%;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;background:var(--black);color:#fff;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;border-right:4px solid var(--black);}
.sidebar h2{padding:0 20px 20px;font-size:20px;border-bottom:3px solid var(--yellow);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.nav-item{padding:14px 20px;cursor:pointer;opacity:.9;font-size:13px;font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:10px;border-left:4px solid transparent;}
.nav-item.active{background:var(--teal);color:#000;opacity:1;border-left:4px solid var(--black);}
.nav-item:hover{opacity:1;background:rgba(255,255,255,.1);}
.main{flex:1;padding:28px;overflow-y:auto;max-width:100%;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.topbar h1{font-size:28px;text-transform:uppercase;font-weight:900;letter-spacing:.5px;}
.btn{background:var(--teal);color:#000;padding:11px 20px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.3px;
  border:3px solid var(--black);box-shadow:var(--shadow-1);transition:transform .08s,box-shadow .08s;}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--black);}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--black);}
.btn.danger{background:var(--magenta);color:#fff;}
.btn.success{background:var(--success);color:#fff;}
.btn.ghost{background:var(--white);color:#000;}
.btn.small{padding:7px 14px;font-size:11px;box-shadow:3px 3px 0 var(--black);}
.btn.small:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--black);}
.card{background:var(--card);border:3px solid var(--black);box-shadow:var(--shadow-2);padding:22px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px;text-align:left;border-bottom:2px solid var(--black);}
th{color:#000;font-weight:900;background:var(--yellow);text-transform:uppercase;font-size:11px;letter-spacing:.3px;}
.badge{padding:4px 12px;border:2px solid var(--black);font-size:11px;font-weight:900;text-transform:uppercase;display:inline-block;}
.badge.green{background:var(--success);color:#fff;}
.badge.yellow{background:var(--yellow);color:#000;}
.badge.red{background:var(--magenta);color:#fff;animation:pulse 1.2s infinite;}
.badge.gray{background:var(--beige);color:#000;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.card h3{font-size:16px;text-transform:uppercase;font-weight:900;letter-spacing:.3px;border-bottom:3px solid var(--yellow);display:inline-block;padding-bottom:4px;}
.form-row{margin-bottom:16px;}
.form-row label{display:block;font-size:12px;font-weight:900;margin-bottom:6px;color:#000;text-transform:uppercase;letter-spacing:.3px;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 12px;border:3px solid var(--black);font-size:14px;background:#fff;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:3px solid var(--teal);outline-offset:1px;}
/* Dropdown custom (hilangkan panah bawaan browser, ganti dengan panah kotak sendiri) */
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:linear-gradient(45deg, transparent 50%, var(--black) 50%), linear-gradient(135deg, var(--black) 50%, transparent 50%);
  background-position:calc(100% - 20px) center, calc(100% - 14px) center; background-size:6px 6px, 6px 6px; background-repeat:no-repeat;
  padding-right:36px !important; cursor:pointer;}
select:hover{background-color:#fffde7;}
/* Checkbox & radio custom persegi, tebal, isi solid saat dicentang */
input[type="checkbox"],input[type="radio"]{appearance:none;-webkit-appearance:none;width:22px;height:22px;min-width:22px;
  border:3px solid var(--black);background:#fff;cursor:pointer;position:relative;flex-shrink:0;vertical-align:middle;}
input[type="radio"]{border-radius:50%;}
input[type="checkbox"]:checked{background:var(--teal);}
input[type="checkbox"]:checked::after{content:'';position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid var(--black);border-width:0 3px 3px 0;transform:rotate(45deg);}
input[type="radio"]:checked{background:#fff;}
input[type="radio"]:checked::after{content:'';position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--black);}
/* File input custom (tombol pilih file ikut gaya brutalist) */
input[type="file"]{border:3px dashed var(--black);padding:10px;background:#fffef5;cursor:pointer;font-size:13px;font-weight:700;}
input[type="file"]::file-selector-button{background:var(--black);color:#fff;border:none;padding:9px 16px;font-weight:900;text-transform:uppercase;font-size:11px;margin-right:12px;cursor:pointer;letter-spacing:.3px;}
input[type="file"]::file-selector-button:hover{background:var(--magenta);}
/* Modal popup custom (pengganti confirm()/prompt() bawaan browser) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-box{background:var(--white);border:4px solid var(--black);box-shadow:var(--shadow-2);max-width:420px;width:100%;padding:28px;}
.modal-box h3{font-size:18px;text-transform:uppercase;font-weight:900;margin-bottom:14px;border-bottom:3px solid var(--yellow);display:inline-block;padding-bottom:4px;}
.modal-box p{font-size:14px;font-weight:600;margin-bottom:18px;line-height:1.5;}
.modal-box input{width:100%;padding:11px 12px;border:3px solid var(--black);font-size:14px;margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.hidden{display:none !important;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:20px;
  background-image:linear-gradient(var(--teal) 2px, transparent 2px),linear-gradient(90deg, var(--teal) 2px, transparent 2px);
  background-size:40px 40px; background-color:#0a0a0a;}
.login-card{background:var(--white);border:4px solid var(--black);box-shadow:var(--shadow-2);padding:38px 32px;max-width:380px;width:100%;}
.login-card h1{text-align:center;color:#000;margin-bottom:6px;font-size:28px;text-transform:uppercase;font-weight:900;}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;font-weight:700;}
.role-tabs{display:flex;gap:8px;margin-bottom:22px;}
.role-tabs button{flex:1;padding:11px;background:var(--white);color:#000;font-weight:900;font-size:12px;border:3px solid var(--black);text-transform:uppercase;}
.role-tabs button.active{background:var(--yellow);box-shadow:3px 3px 0 var(--black);}
.error-msg{background:var(--magenta);color:#fff;padding:10px;border:2px solid var(--black);font-size:13px;font-weight:800;margin-bottom:14px;}
.preview-banner{background:var(--yellow);color:#000;text-align:center;padding:9px;font-size:12px;font-weight:900;border-bottom:3px solid var(--black);text-transform:uppercase;}
/* Exam taking */
.exam-screen{min-height:100vh;background:var(--beige);display:flex;flex-direction:column;}
.exam-header{background:var(--black);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:4px solid var(--yellow);}
.timer{font-size:22px;font-weight:900;background:var(--yellow);color:#000;padding:7px 18px;border:3px solid var(--black);}
.exam-body{flex:1;padding:22px;max-width:700px;margin:0 auto;width:100%;}
.soal-nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.soal-nav button{width:38px;height:38px;background:#fff;border:3px solid var(--black);font-weight:900;font-size:12px;}
.soal-nav button.answered{background:var(--teal);}
.soal-nav button.current{background:var(--magenta);color:#fff;}
.opsi-item{display:flex;align-items:center;gap:10px;padding:13px;border:3px solid var(--black);margin-bottom:10px;cursor:pointer;background:#fff;font-weight:700;}
.opsi-item:hover{background:#fffde7;}
.opsi-item.selected{background:var(--teal);box-shadow:var(--shadow-1);}
.match-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.lock-overlay{position:fixed;inset:0;background:var(--black);color:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;}
.lock-overlay h2{font-size:26px;margin-bottom:12px;color:var(--yellow);text-transform:uppercase;font-weight:900;border:3px solid var(--yellow);padding:10px 20px;}
.warn-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--magenta);color:#fff;padding:14px 24px;border:3px solid var(--black);z-index:9998;font-weight:900;box-shadow:var(--shadow-2);text-transform:uppercase;font-size:13px;}
@media(max-width:768px){
  .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%;flex-direction:row;justify-content:space-around;padding:8px 0;z-index:100;top:auto;height:auto;border-right:none;border-top:4px solid var(--yellow);}
  .sidebar h2{display:none;}
  .nav-item{flex-direction:column;font-size:9px;padding:8px 4px;flex:1;text-align:center;gap:2px;border-left:none;}
  .nav-item.active{border-left:none;border-top:4px solid var(--teal);}
  .main{padding-bottom:90px;}
}
</style>
</head>
<body>
<div id="appRoot"></div>
<div id="toastRoot"></div>
<script type="module">
// ====================== KONFIGURASI APLIKASI ======================
const IS_PREVIEW = false; // UBAH KE false SAAT DEPLOY KE PRODUKSI
// WAJIB DIISI jika frontend ini dihost terpisah (Vercel/GitHub Pages dll), BUKAN lewat URL Apps Script langsung.
// Ambil dari: Apps Script editor -> Deploy -> Manage deployments -> URL yang berakhiran /exec
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD2CgwDJbDysSLr71G-mJn9gyjpNuoi6--cmgY0Z6zKL5NJm-zAPRgHiN-s9J-mC2jIQ/exec";

// ====================== PWA SETUP (Manifest + Service Worker) ======================
const manifest = {
  name: "CBT Sekolah", short_name: "CBT", start_url: ".", display: "standalone",
  background_color: "#f1f5f9", theme_color: "#1e40af",
  icons: [{src:"data:image/svg+xml;base64,"+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%231e40af"/><text x="50" y="62" font-size="40" fill="white" text-anchor="middle" font-family="Arial">CBT</text></svg>'), sizes:"100x100", type:"image/svg+xml"}]
};
document.getElementById('pwaManifest').href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});`;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

// ====================== DATA API (Preview vs Produksi) ======================
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }

let PREVIEW_DB = {
  admin: [{username:'admin', password:'admin2026'}],
  guru: [{id_guru:'g1', nama:'Budi Santoso', mapel:'Matematika', username:'budi', password:'guru123', status_aktif:true,
    nama_lembaga:'MTs Negeri 1 Contoh', kepala_madrasah:'Drs. H. Ahmad Fauzi, M.Pd.', nama_guru_mapel:'Budi Santoso, S.Pd.', logo_type:'', logo_value:''}],
  siswa: [
    {id_siswa:'s1', nama:'Ani Lestari', kelas:'9A'},
    {id_siswa:'s2', nama:'Rudi Hartono', kelas:'9A'}
  ],
  kelas: [ {id_kelas:'k1', nama_kelas:'9A'}, {id_kelas:'k2', nama_kelas:'9B'} ],
  bankSoal: [
    {id_soal:'q1', id_guru:'g1', id_ujian:'u1', tipe_soal:'pg', pertanyaan:'Berapakah hasil dari 12 x 8?',
      data_soal:{opsi:[{k:'a',v:'86'},{k:'b',v:'96'},{k:'c',v:'106'},{k:'d',v:'88'}]}, kunci_jawaban:{benar:'b'}, bobot:10},
    {id_soal:'q2', id_guru:'g1', id_ujian:'u1', tipe_soal:'benar_salah', pertanyaan:'Bilangan prima terkecil adalah 2.',
      data_soal:{}, kunci_jawaban:{benar:true}, bobot:10},
    {id_soal:'q3', id_guru:'g1', id_ujian:'u1', tipe_soal:'pg_kompleks', pertanyaan:'Manakah bilangan genap di bawah ini? (pilih 2)',
      data_soal:{opsi:[{k:'a',v:'3'},{k:'b',v:'4'},{k:'c',v:'7'},{k:'d',v:'8'}]}, kunci_jawaban:{benar:['b','d']}, bobot:10},
    {id_soal:'q4', id_guru:'g1', id_ujian:'u1', tipe_soal:'menjodohkan', pertanyaan:'Jodohkan bangun datar dengan jumlah sisinya',
      data_soal:{kiri:[{k:'1',v:'Segitiga'},{k:'2',v:'Persegi'}], kanan:[{k:'a',v:'4 sisi'},{k:'b',v:'3 sisi'}]},
      kunci_jawaban:{pasangan:{'1':'b','2':'a'}}, bobot:10}
  ],
  ujian: [{id_ujian:'u1', id_guru:'g1', nama_ujian:'Ulangan Harian Matematika', mapel:'Matematika', kelas:'9A',
    tanggal:'2026-11-20', durasi_menit:30, status:'aktif', batas_pelanggaran:3}],
  token: [{token_code:'MTK001', id_ujian:'u1', status_dipakai:false, waktu_generate:nowISO(), waktu_expired:null}],
  hasilUjian: []
};

// ====================== CACHE DATA DI BROWSER ======================
// Tujuan: setelah login, data utama (bank soal, daftar ujian, dll) diunduh sekali lalu dipakai berulang
// saat pindah menu — TIDAK memanggil Spreadsheet setiap kali. Cache otomatis kedaluwarsa & refresh
// sendiri tiap 15 menit, dan langsung diperbarui begitu ada perubahan data (tambah/edit/hapus).
const CACHE_TTL_MS = 15 * 60 * 1000; // 15 menit
let AppCache = {}; // { key: { data, time } }
function cacheGet(key){
  const e = AppCache[key];
  if(!e) return undefined;
  if(Date.now() - e.time > CACHE_TTL_MS) return undefined; // kedaluwarsa, anggap tidak ada
  return e.data;
}
function cacheSet(key, data){ AppCache[key] = { data, time: Date.now() }; }
function cacheInvalidate(prefix){
  Object.keys(AppCache).forEach(k => { if(k.startsWith(prefix)) delete AppCache[k]; });
}
async function cachedCall(key, fnName, args=[]){
  const cached = cacheGet(key);
  if(cached !== undefined) return cached;
  const data = await callServer(fnName, ...args);
  cacheSet(key, data);
  return data;
}

let autoRefreshTimer = null;
async function prefetchAllData(){
  if(STATE.role==='admin'){
    await Promise.all([
      cachedCall('guruList','getGuruList'),
      cachedCall('siswaList','getSiswaList'),
      cachedCall('kelasList','getKelasList'),
      cachedCall('allUjianList','getAllUjianList')
    ]);
  } else if(STATE.role==='guru'){
    await Promise.all([
      cachedCall('ujianList:'+STATE.user.id_guru,'getUjianList',[STATE.user.id_guru]),
      cachedCall('kelasList','getKelasList')
    ]);
  }
}
function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(async ()=>{
    cacheInvalidate(''); // kosongkan semua cache (prefix kosong cocok dengan semua key)
    await prefetchAllData();
    render();
    toast('Data diperbarui otomatis dari server','success');
  }, CACHE_TTL_MS);
}
function stopAutoRefresh(){ if(autoRefreshTimer){ clearInterval(autoRefreshTimer); autoRefreshTimer=null; } }

function callServer(fnName, ...args){
  if (IS_PREVIEW) return Promise.resolve(PreviewAPI[fnName](...args));
  // PENTING: Sengaja TIDAK mengirim header Content-Type secara eksplisit.
  // Ini membuat browser memakai "text/plain" (simple request), sehingga TIDAK memicu
  // CORS preflight (OPTIONS) yang tidak bisa dijawab oleh Apps Script Web App.
  // Jika Anda menambahkan headers:{'Content-Type':'application/json'} di sini, request AKAN GAGAL karena CORS.
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ fn: fnName, args })
  })
  .then(res => res.json())
  .then(json => {
    if (json.error) throw new Error(json.error);
    return json.data;
  })
  .catch(err => {
    toast('Gagal menghubungi server: ' + err.message);
    throw err;
  });
}

const PreviewAPI = {
  loginAdmin(u,p){ const a = PREVIEW_DB.admin.find(x=>x.username===u && x.password===p); return a? {success:true, data:{username:a.username}} : {success:false, message:'Username atau password salah'}; },
  loginGuru(u,p){ const g = PREVIEW_DB.guru.find(x=>x.username===u && x.password===p); if(!g) return {success:false, message:'Username atau password salah'}; if(!g.status_aktif) return {success:false, message:'Akun dinonaktifkan oleh admin'}; return {success:true, data:g}; },
  loginSiswaToken(token, nama){
    const t = PREVIEW_DB.token.find(x=>x.token_code===token);
    if(!t) return {success:false, message:'Token tidak ditemukan'};
    if(t.status_dipakai) return {success:false, message:'Token sudah digunakan'};
    const ujian = PREVIEW_DB.ujian.find(x=>x.id_ujian===t.id_ujian);
    if(!ujian) return {success:false, message:'Ujian tidak ditemukan'};
    t.status_dipakai = true;
    const id_siswa = uid('s');
    PREVIEW_DB.siswa.push({id_siswa, nama, kelas:ujian.kelas});
    const soalList = PREVIEW_DB.bankSoal.filter(s=>s.id_ujian===ujian.id_ujian)
      .map(s=>({id_soal:s.id_soal, tipe_soal:s.tipe_soal, pertanyaan:s.pertanyaan, data_soal:s.data_soal, bobot:s.bobot}));
    const id_hasil = uid('h');
    PREVIEW_DB.hasilUjian.push({id_hasil, id_ujian:ujian.id_ujian, id_siswa, nama_siswa:nama, token_dipakai:token,
      jawaban_json:{}, nilai:null, waktu_mulai:nowISO(), waktu_selesai:null, status:'dikerjakan', jumlah_pelanggaran:0, log_pelanggaran:[]});
    const guruPemilik = PREVIEW_DB.guru.find(g=>g.id_guru===ujian.id_guru) || {};
    const identitas = { nama_lembaga:guruPemilik.nama_lembaga||'', kepala_madrasah:guruPemilik.kepala_madrasah||'', nama_guru_mapel:guruPemilik.nama_guru_mapel||'', logo_type:guruPemilik.logo_type||'', logo_value:guruPemilik.logo_value||'' };
    return {success:true, data:{id_hasil, ujian, soalList, identitas}};
  },
  getGuruList(){ return PREVIEW_DB.guru; },
  addGuru(obj){ obj.id_guru = uid('g'); obj.status_aktif = true; PREVIEW_DB.guru.push(obj); return {success:true}; },
  resetPasswordGuru(id_guru, newPassword){ const g = PREVIEW_DB.guru.find(x=>x.id_guru===id_guru); if(g) g.password = newPassword; return {success:true}; },
  getIdentitas(id_guru){ const g = PREVIEW_DB.guru.find(x=>x.id_guru===id_guru) || {}; return { nama_lembaga:g.nama_lembaga||'', kepala_madrasah:g.kepala_madrasah||'', nama_guru_mapel:g.nama_guru_mapel||'', logo_type:g.logo_type||'', logo_value:g.logo_value||'' }; },
  saveIdentitas(id_guru, data){ const g = PREVIEW_DB.guru.find(x=>x.id_guru===id_guru); if(g) Object.assign(g, data); return {success:true}; },
  toggleGuruStatus(id_guru){ const g = PREVIEW_DB.guru.find(x=>x.id_guru===id_guru); if(g) g.status_aktif = !g.status_aktif; return {success:true}; },

  getSiswaList(){ return PREVIEW_DB.siswa; },
  addSiswaBulk(list){ list.forEach(s=>{ PREVIEW_DB.siswa.push({id_siswa:uid('s'), nama:s.nama, kelas:s.kelas}); }); return {success:true}; },
  updateSiswa(id_siswa, data){ const s = PREVIEW_DB.siswa.find(x=>x.id_siswa===id_siswa); if(s){ s.nama = data.nama; s.kelas = data.kelas; } return {success:true}; },
  deleteSiswa(id_siswa){ PREVIEW_DB.siswa = PREVIEW_DB.siswa.filter(x=>x.id_siswa!==id_siswa); return {success:true}; },

  getKelasList(){ return PREVIEW_DB.kelas; },
  addKelas(nama_kelas){ const id_kelas = uid('k'); PREVIEW_DB.kelas.push({id_kelas, nama_kelas}); return {success:true, id_kelas}; },
  updateKelas(id_kelas, nama_kelas){ const k = PREVIEW_DB.kelas.find(x=>x.id_kelas===id_kelas); if(k) k.nama_kelas = nama_kelas; return {success:true}; },
  deleteKelas(id_kelas){ PREVIEW_DB.kelas = PREVIEW_DB.kelas.filter(x=>x.id_kelas!==id_kelas); return {success:true}; },

  getSoalByUjian(id_ujian){ return PREVIEW_DB.bankSoal.filter(x=>x.id_ujian===id_ujian); },
  saveSoal(obj){ if(obj.id_soal){ const i = PREVIEW_DB.bankSoal.findIndex(x=>x.id_soal===obj.id_soal); PREVIEW_DB.bankSoal[i] = obj; } else { obj.id_soal = uid('q'); PREVIEW_DB.bankSoal.push(obj); } return {success:true, id_soal:obj.id_soal}; },
  importSoalBulk(list){ list.forEach(obj=>{ obj.id_soal = uid('q'); PREVIEW_DB.bankSoal.push(obj); }); return {success:true, jumlah:list.length}; },
  deleteSoal(id_soal){ PREVIEW_DB.bankSoal = PREVIEW_DB.bankSoal.filter(x=>x.id_soal!==id_soal); return {success:true}; },

  getUjianList(id_guru){ return PREVIEW_DB.ujian.filter(x=>x.id_guru===id_guru); },
  getAllUjianList(){ return PREVIEW_DB.ujian; },
  saveUjian(obj){ if(obj.id_ujian){ const i = PREVIEW_DB.ujian.findIndex(x=>x.id_ujian===obj.id_ujian); PREVIEW_DB.ujian[i] = {...PREVIEW_DB.ujian[i], ...obj}; } else { obj.id_ujian = uid('u'); obj.status='aktif'; PREVIEW_DB.ujian.push(obj); } return {success:true, id_ujian:obj.id_ujian}; },
  deleteUjian(id_ujian){ PREVIEW_DB.ujian = PREVIEW_DB.ujian.filter(x=>x.id_ujian!==id_ujian); PREVIEW_DB.bankSoal = PREVIEW_DB.bankSoal.filter(x=>x.id_ujian!==id_ujian); return {success:true}; },

  generateToken(id_ujian, jumlah){ const tokens=[]; for(let i=0;i<jumlah;i++){ const code = Math.random().toString(36).slice(2,8).toUpperCase(); PREVIEW_DB.token.push({token_code:code, id_ujian, status_dipakai:false, waktu_generate:nowISO(), waktu_expired:null}); tokens.push(code);} return {success:true, tokens}; },
  getTokenList(id_ujian){ return PREVIEW_DB.token.filter(x=>x.id_ujian===id_ujian); },
  reportViolation(id_hasil){
    const h = PREVIEW_DB.hasilUjian.find(x=>x.id_hasil===id_hasil);
    if(!h) return {success:false};
    h.jumlah_pelanggaran++;
    h.log_pelanggaran.push({waktu:nowISO()});
    const ujian = PREVIEW_DB.ujian.find(x=>x.id_ujian===h.id_ujian);
    let locked = false;
    if(h.jumlah_pelanggaran >= ujian.batas_pelanggaran && h.status==='dikerjakan'){ h.status = 'terkunci_menunggu_persetujuan'; locked = true; }
    return {success:true, locked, jumlah_pelanggaran:h.jumlah_pelanggaran};
  },
  getHasilStatus(id_hasil){ const h = PREVIEW_DB.hasilUjian.find(x=>x.id_hasil===id_hasil); return h? {status:h.status, jumlah_pelanggaran:h.jumlah_pelanggaran} : {status:'tidak_ditemukan'}; },
  getMonitoring(id_ujian){ return PREVIEW_DB.hasilUjian.filter(x=>x.id_ujian===id_ujian).map(h=>({id_hasil:h.id_hasil, nama_siswa:h.nama_siswa, status:h.status, jumlah_pelanggaran:h.jumlah_pelanggaran})); },
  approveSiswa(id_hasil){ const h = PREVIEW_DB.hasilUjian.find(x=>x.id_hasil===id_hasil); if(h){ h.status='dikerjakan'; } return {success:true}; },
  forceSubmitSiswa(id_hasil){ return PreviewAPI.submitJawaban(id_hasil, null, true); },
  submitJawaban(id_hasil, jawabanJson, dipaksaGuru){
    const h = PREVIEW_DB.hasilUjian.find(x=>x.id_hasil===id_hasil);
    if(!h) return {success:false};
    if(jawabanJson) h.jawaban_json = jawabanJson;
    const soalUjian = PREVIEW_DB.bankSoal.filter(s=>s.id_ujian===h.id_ujian);
    let total=0, maks=0;
    soalUjian.forEach(soal=>{
      maks += soal.bobot;
      const jwb = h.jawaban_json[soal.id_soal];
      if(jwb===undefined) return;
      if(soal.tipe_soal==='pg' || soal.tipe_soal==='benar_salah'){ if(jwb === soal.kunci_jawaban.benar) total += soal.bobot; }
      else if(soal.tipe_soal==='pg_kompleks'){
        const benar = soal.kunci_jawaban.benar.slice().sort().join(',');
        const jawab = (jwb||[]).slice().sort().join(',');
        if(benar===jawab) total += soal.bobot;
      } else if(soal.tipe_soal==='menjodohkan'){
        const pasangan = soal.kunci_jawaban.pasangan; let semuaBenar = true;
        Object.keys(pasangan).forEach(k=>{ if(!jwb || jwb[k]!==pasangan[k]) semuaBenar=false; });
        if(semuaBenar) total += soal.bobot;
      }
    });
    h.nilai = maks>0 ? Math.round((total/maks)*100) : 0;
    h.status = 'selesai';
    h.waktu_selesai = nowISO();
    return {success:true, nilai:h.nilai};
  },
  getHasilUjian(id_ujian){ return PREVIEW_DB.hasilUjian.filter(x=>x.id_ujian===id_ujian); },
  publishHasil(id_ujian){ PREVIEW_DB.hasilUjian.filter(x=>x.id_ujian===id_ujian).forEach(h=> h.dipublikasikan = true); return {success:true}; },
  getHasilSiswa(id_hasil){ const h = PREVIEW_DB.hasilUjian.find(x=>x.id_hasil===id_hasil); return h? {nilai:h.nilai, dipublikasikan: !!h.dipublikasikan, status:h.status} : null; }
};

let STATE = { role:null, user:null, view:'dashboard', examData:null, examAnswers:{}, examTimer:null, examSecondsLeft:0, lockPollTimer:null, cheatCount:0 };

// ====================== MODAL CUSTOM (pengganti confirm()/prompt() bawaan browser) ======================
function closeModal(){
  const ov = document.getElementById('customModalOverlay');
  if(ov) ov.remove();
}
function showConfirmModal({title='Konfirmasi', message='', confirmLabel='Konfirmasi', cancelLabel='Batal', danger=false}){
  return new Promise(resolve=>{
    closeModal();
    const overlay = document.createElement('div');
    overlay.id = 'customModalOverlay';
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${title}</h3>
        <p>${message}</p>
        <div class="modal-actions">
          <button class="btn ghost" id="modalBtnCancel">${cancelLabel}</button>
          <button class="btn ${danger?'danger':'success'}" id="modalBtnConfirm">${confirmLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ closeModal(); resolve(false); } });
    document.getElementById('modalBtnCancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('modalBtnConfirm').onclick = ()=>{ closeModal(); resolve(true); };
  });
}
function showPromptModal({title='Masukkan Data', message='', placeholder='', defaultValue='', confirmLabel='Simpan', cancelLabel='Batal', inputType='text'}){
  return new Promise(resolve=>{
    closeModal();
    const overlay = document.createElement('div');
    overlay.id = 'customModalOverlay';
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${title}</h3>
        ${message ? `<p>${message}</p>` : ''}
        <input type="${inputType}" id="modalPromptInput" placeholder="${placeholder}" value="${defaultValue}">
        <div class="modal-actions">
          <button class="btn ghost" id="modalBtnCancel">${cancelLabel}</button>
          <button class="btn success" id="modalBtnConfirm">${confirmLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const inputEl = document.getElementById('modalPromptInput');
    setTimeout(()=> inputEl.focus(), 50);
    const submit = ()=>{ const val = inputEl.value; closeModal(); resolve(val); };
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ closeModal(); resolve(null); } });
    inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submit(); });
    document.getElementById('modalBtnCancel').onclick = ()=>{ closeModal(); resolve(null); };
    document.getElementById('modalBtnConfirm').onclick = submit;
  });
}
function showFormModal({title='Edit Data', fields=[], confirmLabel='Simpan', cancelLabel='Batal'}){
  // fields: [{id,label,type:'text'|'select'|'number',value,options?}]
  return new Promise(resolve=>{
    closeModal();
    const overlay = document.createElement('div');
    overlay.id = 'customModalOverlay';
    overlay.className = 'modal-overlay';
    const fieldsHtml = fields.map(f=>{
      if(f.type==='select'){
        return `<div class="form-row"><label>${f.label}</label><select id="modalField_${f.id}">${(f.options||[]).map(o=>`<option value="${o}" ${o===f.value?'selected':''}>${o}</option>`).join('')}</select></div>`;
      }
      return `<div class="form-row"><label>${f.label}</label><input type="${f.type||'text'}" id="modalField_${f.id}" value="${f.value!==undefined?f.value:''}"></div>`;
    }).join('');
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${title}</h3>
        ${fieldsHtml}
        <div class="modal-actions">
          <button class="btn ghost" id="modalBtnCancel">${cancelLabel}</button>
          <button class="btn success" id="modalBtnConfirm">${confirmLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ closeModal(); resolve(null); } });
    document.getElementById('modalBtnCancel').onclick = ()=>{ closeModal(); resolve(null); };
    document.getElementById('modalBtnConfirm').onclick = ()=>{
      const result = {};
      fields.forEach(f=>{ result[f.id] = document.getElementById('modalField_'+f.id).value; });
      closeModal(); resolve(result);
    };
  });
}

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'warn-toast';
  if(type==='success') el.style.background = 'var(--success)';
  el.textContent = msg;
  toastRoot.appendChild(el);
  setTimeout(()=> el.remove(), 3500);
}

function render(){
  if(!STATE.role){ renderLogin(); return; }
  if(STATE.role==='siswa' && STATE.examData){ renderExam(); return; }

      </div>
      <div id="errBox"></div>
      <div id="loginFormWrap"></div>
    </div>
  </div>`;
  document.getElementById('tabGuru').onclick = ()=>{ loginTab='guru'; renderLogin(); };
  document.getElementById('tabSiswa').onclick = ()=>{ loginTab='siswa'; renderLogin(); };
  const wrap = document.getElementById('loginFormWrap');
  if(loginTab==='guru'){
    wrap.innerHTML = `

      <div class="form-row"><label>Password</label><input id="lp" type="password" placeholder="Password"></div>
      <button class="btn" style="width:100%" id="btnLoginGuru">Masuk</button>`;
    document.getElementById('btnLoginGuru').onclick = async ()=>{
      const u = document.getElementById('lu').value.trim(), p = document.getElementById('lp').value;
      let res = await callServer('loginAdmin', u, p);
      if(res.success){ STATE.role='admin'; STATE.user=res.data; await prefetchAllData(); startAutoRefresh(); render(); return; }
      res = await callServer('loginGuru', u, p);
      if(res.success){ STATE.role='guru'; STATE.user=res.data; await prefetchAllData(); startAutoRefresh(); render(); return; }
      document.getElementById('errBox').innerHTML = `<div class="error-msg">${res.message||'Login gagal'}</div>`;
    };
  } else {
    wrap.innerHTML = `
      <div class="form-row"><label>Nomor Token Ujian</label><input id="ltoken" placeholder="Masukkan token dari guru" style="text-transform:uppercase"></div>
      <div class="form-row"><label>Nama Lengkap</label><input id="lnama" placeholder="Nama sesuai absen"></div>
      <button class="btn" style="width:100%" id="btnLoginSiswa">Mulai Ujian</button>`;
    document.getElementById('btnLoginSiswa').onclick = async ()=>{
      const token = document.getElementById('ltoken').value.trim().toUpperCase();
      const nama = document.getElementById('lnama').value.trim();
      if(!token || !nama){ document.getElementById('errBox').innerHTML = `<div class="error-msg">Token dan nama wajib diisi</div>`; return; }
      const res = await callServer('loginSiswaToken', token, nama);
      if(!res.success){ document.getElementById('errBox').innerHTML = `<div class="error-msg">${res.message}</div>`; return; }
      STATE.role='siswa'; STATE.user={nama};
      startExamSession(res.data);
    };
  }
}

function logout(){
  if(STATE.examTimer) clearInterval(STATE.examTimer);
  if(STATE.lockPollTimer) clearInterval(STATE.lockPollTimer);
  stopAutoRefresh();
  AppCache = {};
  STATE = { role:null, user:null, view:'dashboard', examData:null, examAnswers:{}, examTimer:null, examSecondsLeft:0, lockPollTimer:null, cheatCount:0 };
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  render();
}

    for(const u of ujianList){
      const hasil = await cachedCall('hasilUjian:'+u.id_ujian,'getHasilUjian',[u.id_ujian]);
      rows += hasil.map(h=>`<tr><td>${u.nama_ujian}</td><td>${h.nama_siswa}</td><td>${h.nilai ?? '-'}</td><td>${h.status}</td></tr>`).join('');

}

function parseCSVLine(line){
  const result = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch==='"'){ inQuotes = !inQuotes; }
    else if(ch===',' && !inQuotes){ result.push(cur); cur=''; }
    else { cur += ch; }
  }
  result.push(cur);
  return result.map(x=>x.trim());
}
function buildSoalFromCSVRow(cols, id_guru, id_ujian){
  const [tipe_soal, pertanyaan, d1, d2, d3, d4, kunci, bobotStr] = cols;
  const bobot = parseInt(bobotStr) || 10;
  let data_soal = {}, kunci_jawaban = {};
  if(tipe_soal==='pg'){
    data_soal = { opsi:[{k:'a',v:d1},{k:'b',v:d2},{k:'c',v:d3},{k:'d',v:d4}] };
    kunci_jawaban = { benar: kunci.trim() };
  } else if(tipe_soal==='pg_kompleks'){
    data_soal = { opsi:[{k:'a',v:d1},{k:'b',v:d2},{k:'c',v:d3},{k:'d',v:d4}] };
    kunci_jawaban = { benar: kunci.split('|').map(x=>x.trim()) };
  } else if(tipe_soal==='benar_salah'){
    kunci_jawaban = { benar: kunci.trim().toLowerCase()==='benar' };
  } else if(tipe_soal==='menjodohkan'){
    const kiriArr = d1.split('|').map(x=>x.trim()).filter(Boolean);
    const kananArr = d2.split('|').map(x=>x.trim()).filter(Boolean);
    const kiri = kiriArr.map((v,i)=>({k:String(i+1), v}));
    const kanan = kananArr.map((v,i)=>({k:String.fromCharCode(97+i), v}));
    const pasangan = {}; kiri.forEach((k,i)=> pasangan[k.k] = kanan[i] ? kanan[i].k : '');
    data_soal = { kiri, kanan };
    kunci_jawaban = { pasangan };
  } else {
    return null;
  }
  return { id_guru, id_ujian, tipe_soal, pertanyaan, data_soal, kunci_jawaban, bobot };
}
function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        const kanan = kananArr.map((v,i)=>({k:String.fromCharCode(97+i), v}));
        const pasangan = {}; kiri.forEach((k,i)=> pasangan[k.k] = kanan[i].k);
        data_soal = { kiri, kanan };
        kunci_jawaban = { pasangan };
      }

      if(ok){ await callServer('deleteSoal', b.dataset.delsoal); cacheInvalidate('soalByUjian:'+buatUjianEditingId); renderGuru(); }
    });

    const TEMPLATE_ROWS = [
      ['tipe_soal','pertanyaan','data1','data2','data3','data4','kunci','bobot'],
      ['pg','Berapakah hasil dari 5 + 3?','6','7','8','9','c','10'],
      ['pg_kompleks','Manakah bilangan genap? (pilih 2)','3','4','7','8','b|d','10'],
      ['benar_salah','Matahari terbit dari timur','','','','','benar','10'],
      ['menjodohkan','Jodohkan ibu kota dengan negaranya','Indonesia|Jepang','Jakarta|Tokyo','','','','10']
    ];
    document.getElementById('btnDownloadTemplateCSV').onclick = ()=>{
      const csv = TEMPLATE_ROWS.map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      downloadTextFile('template_impor_soal.csv', csv, 'text/csv;charset=utf-8;');
    };
    document.getElementById('btnDownloadTemplateXLSX').onclick = ()=>{
      const ws = XLSX.utils.aoa_to_sheet(TEMPLATE_ROWS);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Soal');
      XLSX.writeFile(wb, 'template_impor_soal.xlsx');
    };
    function processImportedRows(rowsAsArrays){
      const resultBox = document.getElementById('importResultBox');
      const dataRows = rowsAsArrays.slice(1).filter(r => r && r.some(c => c !== undefined && c !== null && String(c).trim() !== ''));
      const soalArray = [];
      let gagal = 0;
      dataRows.forEach(row=>{
        const cols = [0,1,2,3,4,5,6,7].map(i => row[i]===undefined || row[i]===null ? '' : String(row[i]).trim());
        if(!cols[0] || !cols[1]){ gagal++; return; }
        const soal = buildSoalFromCSVRow(cols, STATE.user.id_guru, buatUjianEditingId);
        if(soal) soalArray.push(soal); else gagal++;
      });
      if(soalArray.length===0){ resultBox.innerHTML = '<span style="color:var(--danger)">Tidak ada soal valid ditemukan di file.</span>'; return; }
      callServer('importSoalBulk', soalArray).then(()=>{
        cacheInvalidate('soalByUjian:'+buatUjianEditingId);
        resultBox.innerHTML = `<span style="color:var(--success)">${soalArray.length} soal berhasil diimpor dan langsung aktif di ujian ini.${gagal>0 ? ' ('+gagal+' baris dilewati karena format salah/kosong)' : ''}</span>`;
        toast(`${soalArray.length} soal berhasil diimpor`,'success');
        setTimeout(()=>renderGuru(), 1200);
      });
    }
    document.getElementById('btnImportSoal').onclick = ()=>{
      const fileInput = document.getElementById('sq_importfile');
      const resultBox = document.getElementById('importResultBox');
      if(!fileInput.files || !fileInput.files[0]){ toast('Pilih file terlebih dahulu'); return; }
      const file = fileInput.files[0];
      const namaFile = file.name.toLowerCase();
      if(namaFile.endsWith('.xlsx') || namaFile.endsWith('.xls')){
        const reader = new FileReader();
        reader.onload = (e)=>{
          try{
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            processImportedRows(rows);
          } catch(err){
            resultBox.innerHTML = `<span style="color:var(--danger)">Gagal membaca file Excel: ${err.message}</span>`;
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = (e)=>{
          const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim()!=='');
          processImportedRows(lines.map(line => parseCSVLine(line)));
        };
        reader.readAsText(file);
      }
    };
    return;
  }

  document.querySelectorAll('[data-kelolasoal]').forEach(b=> b.onclick = ()=>{ buatUjianEditingId = b.dataset.kelolasoal; renderGuru(); });
  document.querySelectorAll('[data-editujian]').forEach(b=> b.onclick = async ()=>{
    const list = await cachedCall('ujianList:'+STATE.user.id_guru,'getUjianList',[STATE.user.id_guru]);
    const u = list.find(x=>x.id_ujian===b.dataset.editujian);
    const kelasList = await cachedCall('kelasList','getKelasList');
    const hasil = await showFormModal({
      title: 'Edit Ujian',
      fields: [
        { id:'nama_ujian', label:'Nama Ujian', type:'text', value:u.nama_ujian },
        { id:'kelas', label:'Kelas', type:'select', value:u.kelas, options:kelasList.map(k=>k.nama_kelas) },
        { id:'tanggal', label:'Tanggal', type:'date', value:u.tanggal },
        { id:'durasi_menit', label:'Durasi (menit)', type:'number', value:u.durasi_menit },
        { id:'batas_pelanggaran', label:'Batas Pelanggaran', type:'number', value:u.batas_pelanggaran }
      ],
      confirmLabel:'Simpan'

let identitasLogoPreview = null; // {type:'upload'|'drive', value: dataURL/URL} - preview sementara sebelum disimpan
function parseGoogleDriveLink(url){
  if(!url) return '';
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m && m[1]) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  return url; // asumsikan sudah berupa link langsung
}
function resizeImageToDataURL(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Gagal membaca gambar'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('Gagal membaca file'));
    reader.readAsDataURL(file);
  });
}

// ====================== HALAMAN UJIAN SISWA ======================
function startExamSession(data){
  STATE.examData = data; // {id_hasil, ujian, soalList}
  STATE.examAnswers = {};
  STATE.examSecondsLeft = data.ujian.durasi_menit * 60;
  STATE.currentSoalIndex = 0;
  STATE.cheatCount = 0;
  STATE.examLocked = false;
  render();
  setTimeout(enterFullscreenAndMonitor, 300);
}

function enterFullscreenAndMonitor(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  document.addEventListener('visibilitychange', onVisibilityChange);
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('contextmenu', blockContext);
  document.addEventListener('keydown', blockDevKeys);
  startExamTimer();
}
function stopExamMonitoring(){
  document.removeEventListener('visibilitychange', onVisibilityChange);
  document.removeEventListener('fullscreenchange', onFullscreenChange);
  document.removeEventListener('contextmenu', blockContext);
  document.removeEventListener('keydown', blockDevKeys);
}
function blockContext(e){ if(STATE.role==='siswa' && STATE.examData) e.preventDefault(); }
function blockDevKeys(e){
  if(!STATE.examData) return;
  if(e.key==='F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key==='u')){
    e.preventDefault(); handleViolation();
  }
}
function onVisibilityChange(){ if(document.hidden && STATE.examData && !STATE.examLocked) handleViolation(); }
function onFullscreenChange(){ if(!document.fullscreenElement && STATE.examData && !STATE.examLocked) handleViolation(); }

async function handleViolation(){
  if(!STATE.examData || STATE.examLocked) return;
  STATE.cheatCount++;
  const res = await callServer('reportViolation', STATE.examData.id_hasil);
  if(res.locked){
    STATE.examLocked = true;
    clearInterval(STATE.examTimer);
    renderExam();
    startLockPolling();
  } else {
    toast(`Peringatan! Anda terdeteksi mencoba keluar dari ujian (${res.jumlah_pelanggaran}x). Pelanggaran dicatat pengawas.`);
    if(STATE.role==='siswa') setTimeout(()=>{ const el=document.documentElement; if(el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(()=>{}); }, 500);
    renderExam();
  }
}

function startLockPolling(){
  if(STATE.lockPollTimer) clearInterval(STATE.lockPollTimer);
  STATE.lockPollTimer = setInterval(async ()=>{
    const res = await callServer('getHasilStatus', STATE.examData.id_hasil);
    if(res.status === 'dikerjakan'){
      clearInterval(STATE.lockPollTimer);
      STATE.examLocked = false;
      toast('Pengawas mengizinkan Anda melanjutkan ujian','success');
      renderExam();
      const el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      startExamTimer();
    } else if(res.status === 'selesai'){
      clearInterval(STATE.lockPollTimer);
      finishExamUI(null);
    }
  }, 3000);
}

function startExamTimer(){
  if(STATE.examTimer) clearInterval(STATE.examTimer);
  STATE.examTimer = setInterval(()=>{
    if(STATE.examLocked) return;
    STATE.examSecondsLeft--;
    const tmEl = document.getElementById('examTimerDisplay');
    if(tmEl) tmEl.textContent = formatTime(STATE.examSecondsLeft);
    if(STATE.examSecondsLeft <= 0){ clearInterval(STATE.examTimer); submitExam(true); }
  }, 1000);
}
function formatTime(s){ const m = Math.floor(s/60); const sec = s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

function renderExam(){

  const logoSrc = identitas && identitas.logo_value ? (identitas.logo_type==='drive' ? parseGoogleDriveLink(identitas.logo_value) : identitas.logo_value) : '';
  root.innerHTML = `

        ${soalList.map((s,i)=>`<button class="${STATE.examAnswers[s.id_soal]!==undefined?'answered':''} ${i===idx?'current':''}" data-goto="${i}">${i+1}</button>`).join('')}

  </div>`;
  renderSoalContent(soal);
  soalList.forEach((s,i)=>{ document.querySelector(`[data-goto="${i}"]`).onclick = ()=>{ STATE.currentSoalIndex = i; renderExam(); }; });
  if(idx>0) document.getElementById('btnPrevSoal').onclick = ()=>{ STATE.currentSoalIndex--; renderExam(); };
  if(idx<soalList.length-1) document.getElementById('btnNextSoal').onclick = ()=>{ STATE.currentSoalIndex++; renderExam(); };
  else document.getElementById('btnSelesai').onclick = async ()=>{
    const ok = await showConfirmModal({ title:'Kumpulkan Jawaban', message:'Yakin ingin mengumpulkan jawaban? Jawaban tidak bisa diubah lagi setelah ini.', confirmLabel:'Ya, Kumpulkan' });
    if(ok) submitExam(false);
  };
}

function renderSoalContent(soal){
  const el = document.getElementById('soalContent');
  const current = STATE.examAnswers[soal.id_soal];
  if(soal.tipe_soal==='pg'){
    el.innerHTML = soal.data_soal.opsi.map(o=>`<div class="opsi-item ${current===o.k?'selected':''}" data-pick="${o.k}"><strong>${o.k.toUpperCase()}.</strong> ${o.v}</div>`).join('');
    el.querySelectorAll('[data-pick]').forEach(d=> d.onclick = ()=>{ STATE.examAnswers[soal.id_soal] = d.dataset.pick; renderExam(); });
  } else if(soal.tipe_soal==='pg_kompleks'){
    const sel = current || [];
    el.innerHTML = soal.data_soal.opsi.map(o=>`<div class="opsi-item ${sel.includes(o.k)?'selected':''}" data-pickm="${o.k}"><strong>${o.k.toUpperCase()}.</strong> ${o.v}</div>`).join('') + `<p style="font-size:12px;color:var(--muted);margin-top:6px">Pilih 2 jawaban yang benar</p>`;
    el.querySelectorAll('[data-pickm]').forEach(d=> d.onclick = ()=>{
      let arr = STATE.examAnswers[soal.id_soal] || [];
      const k = d.dataset.pickm;
      if(arr.includes(k)) arr = arr.filter(x=>x!==k);
      else if(arr.length<2) arr = [...arr, k];
      STATE.examAnswers[soal.id_soal] = arr; renderExam();
    });
  } else if(soal.tipe_soal==='benar_salah'){
    el.innerHTML = `
      <div class="opsi-item ${current===true?'selected':''}" data-bs="true">Benar</div>
      <div class="opsi-item ${current===false?'selected':''}" data-bs="false">Salah</div>`;
    el.querySelectorAll('[data-bs]').forEach(d=> d.onclick = ()=>{ STATE.examAnswers[soal.id_soal] = d.dataset.bs==='true'; renderExam(); });
  } else if(soal.tipe_soal==='menjodohkan'){
    const pasangan = current || {};
    const kananShuffled = soal.data_soal.kanan;
    el.innerHTML = soal.data_soal.kiri.map(k=>`
      <div class="match-row"><div style="flex:1">${k.v}</div>
      <select data-match="${k.k}" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px">
        <option value="">-- pilih jawaban --</option>
        ${kananShuffled.map(r=>`<option value="${r.k}" ${pasangan[k.k]===r.k?'selected':''}>${r.v}</option>`).join('')}
      </select></div>`).join('');
    el.querySelectorAll('[data-match]').forEach(sel2=> sel2.onchange = ()=>{
      const p = STATE.examAnswers[soal.id_soal] || {};
      p[sel2.dataset.match] = sel2.value;
      STATE.examAnswers[soal.id_soal] = p;
    });
  }
}

async function submitExam(autoByTimer){
  clearInterval(STATE.examTimer);
  if(STATE.lockPollTimer) clearInterval(STATE.lockPollTimer);
  const res = await callServer('submitJawaban', STATE.examData.id_hasil, STATE.examAnswers, false);
  finishExamUI(res.nilai);
}
function finishExamUI(nilai){
  stopExamMonitoring();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  const identitas = STATE.examData ? STATE.examData.identitas : null;
  const logoSrc = identitas && identitas.logo_value ? (identitas.logo_type==='drive' ? parseGoogleDriveLink(identitas.logo_value) : identitas.logo_value) : '';
  root.innerHTML = `
  <div class="login-wrap"><div class="login-card" style="text-align:center">
    ${identitas && identitas.nama_lembaga ? `
    <div style="margin-bottom:18px">
      ${logoSrc ? `<img src="${logoSrc}" style="width:48px;height:48px;object-fit:contain;margin-bottom:6px">` : ''}
      <div style="font-size:12px;font-weight:900;text-transform:uppercase">${identitas.nama_lembaga}</div>
    </div>` : ''}
    <h1 style="color:var(--success)">✓ Ujian Selesai</h1>
    <p class="sub">Terima kasih, jawaban Anda telah dikumpulkan.</p>
    ${nilai!==null ? `<div style="font-size:13px;color:var(--muted);margin-top:10px">Nilai akan diumumkan oleh guru.</div>` : ''}
    <button class="btn" style="width:100%;margin-top:20px" id="btnKembali">Kembali ke Halaman Masuk</button>
  </div></div>`;
  document.getElementById('btnKembali').onclick = logout;
}

// ====================== START APP ======================
render();
</script>
</body>
</html>
